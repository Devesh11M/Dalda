<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tally Prime Course - DEVA</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; background:#f0f2f5; color:#1a1a1a; user-select:none; -webkit-user-select:none;}
  .container{max-width:1000px; margin:auto; padding:15px;}
  h2{margin:10px 0 15px 5px; font-size:22px;}
  .video-box{position:relative; padding-bottom:56.25%; height:0; background:#000; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
  .video-box iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .playlist{margin-top:20px; background:#fff; border-radius:16px; padding:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05);}
  .video-item{display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; cursor:pointer; border:2px solid transparent; transition:0.2s;}
  .video-item:hover{background:#f5f7ff;}
  .video-item.active{border-color:#4a5bff; background:#eef0ff;}
  .video-item img{width:130px; height:75px; border-radius:10px; object-fit:cover; background:#ddd; flex-shrink:0;}
  .video-item input[type="radio"]{transform:scale(1.4); flex-shrink:0; accent-color:#4a5bff;}
  .title{font-weight:600; font-size:15px; line-height:1.3;}
  
  /* Mobile / iPhone / Tab Responsive */
  @media (max-width: 768px){
    .container{padding:10px;}
    h2{font-size:18px;}
    .video-item{padding:10px; gap:10px;}
    .video-item img{width:95px; height:58px; border-radius:8px;}
    .title{font-size:13.5px;}
  }
  @media (max-width: 480px){
    .video-box{border-radius:12px;}
    .video-item img{width:80px; height:50px;}
  }
</style>
</head>
<body>
<div class="container">
  <h2>Tally Prime Full Course</h2>
  <div class="video-box">
    <iframe id="player" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <div class="playlist" id="playlist"></div>
</div>
<script>
// =================== BAS YAHAN VIDEO ADD KARO ===================
const videos = [
{ id: "DHJwXmDLkNM", title: "Chapter 1 - company tax" },
{ id: "ai9Dq6mSk0c", title: "Chapter 2 - Company tax" },
{ id: "kjjBtu6ieAY", title: "Chapter 3 - company tax" },
{ id: "8xA_rjZBCLg", title: "Chapter 4 - company tax" },
{ id: "bCrWoEOOxRs", title: "Chapter 5 - GST" },
{ id: "V--uTxOc4is", title: "Chapter 5 - Price Level, Batch Wise, Job Order" },
{ id: "ZUUYaXhPThA", title: "Chapter 5 - GST" },
{ id: "c9zyqtUpcKA", title: "Chapter 5 - GST" },
{ id: "qmwFszPU6FU", title: "Chapter 5 - GST" },
{ id: "GJbZOOfT0Fw", title: "Chapter 5 - Batches" },
{ id: "RBjZSK-Xdso", title: "Chapter 5 - Batches" },
{ id: "YHFLLKLA8zM", title: "Chapter 5 - compound Interest" },
{ id: "ZEo0rlaWoGQ", title: "Chapter 5 - Multiple Price Level" },
{ id: "tiGUvnmg9E8", title: "Chapter 5 - Job Order Processing" },
{ id: "ZCVF4f4k6TE", title: "Chapter 5 - TDS" },
{ id: "EOIaPWyg-mc", title: "Chapter 5 - TDS" },
{ id: "R3yg2ZbBAY4", title: "Chapter 5 - TDS" },
{ id: "K-14-bKq2sA", title: "Chapter 5 - PAYROLL" },
{ id: "4vaL7MXda5E", title: "Chapter 5 - GST" },
{ id: "Fkufxn77s7E", title: "Chapter 5 - JOB ORDER" },
{ id: "Hcz8_SImaq0", title: "Chapter 5 - Multiple Mailing Address" },
{ id: "tu_q5fe_5xs", title: "Chapter 5 - TCS" },
];
// ================================================================

const playlistDiv = document.getElementById('playlist');
const player = document.getElementById('player');

function loadPlaylist(){
  playlistDiv.innerHTML = "";
  videos.forEach((v, index)=>{
    const thumb = `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
    const div = document.createElement('div');
    div.className = 'video-item' + (index===0 ? ' active' : '');
    div.innerHTML = `
      <input type="radio" name="video" ${index===0 ? 'checked' : ''}>
      <img src="${thumb}" alt="">
      <div class="title">${v.title}</div>
    `;
    div.onclick = () => playVideo(v.id, div);
    playlistDiv.appendChild(div);
  });
  if(videos.length > 0){
    player.src = `https://www.youtube.com/embed/${videos[0].id}?rel=0&modestbranding=1`;
  }
}
function playVideo(id, element){
  player.src = `https://www.youtube.com/embed/${id}?rel=0&autoplay=1&modestbranding=1`;
  document.querySelectorAll('.video-item').forEach(el=>el.classList.remove('active'));
  element.classList.add('active');
  element.querySelector('input[type="radio"]').checked = true;
  window.scrollTo({top:0, behavior:'smooth'});
}
loadPlaylist();
</script>

<script>
// ===== View Source / Inspect Disable - DEVA Protection =====
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = function(e){
  if(e.keyCode==123) return false;
  if(e.ctrlKey && e.keyCode==85) return false; // Ctrl+U
  if(e.ctrlKey && e.shiftKey && e.keyCode==73) return false; // Ctrl+Shift+I
  if(e.ctrlKey && e.shiftKey && e.keyCode==67) return false; // Ctrl+Shift+C
  if(e.ctrlKey && e.shiftKey && e.keyCode==74) return false; // Ctrl+Shift+J
  if(e.ctrlKey && e.keyCode==83) return false; // Ctrl+S
};
// ===========================================================
</script>
</body>
</html>
