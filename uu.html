<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devesh Sir Tally</title>
<style>
body{background:#ff1a8a; margin:0; padding:10px; font-family:Arial; text-align:center;}
h1{background:yellow; display:inline-block; padding:10px 20px; border-radius:12px; font-size:20px;}
#mainPlayer{width:95%; max-width:900px; height:460px; border-radius:20px; border:4px solid yellow; background:black;}
#grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; max-width:900px; margin:20px auto;}
.card{background:white; border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.card img{width:100%; height:130px; object-fit:cover;}
.card p{margin:8px; font-size:13px; font-weight:bold; text-align:left; height:38px; overflow:hidden;}
.card.active{outline:4px solid yellow;}
</style>
</head>
<body>
<h1>Devesh Sir - Tally Prime Course (22 Videos)</h1>
<br>
<iframe id="mainPlayer" src="https://www.youtube.com/embed?listType=playlist&list=PLYazKoZJJto_fOBHijYa1fWwZK7l0SVy5&index=0" allowfullscreen></iframe>
<div id="grid">Loading thumbnails... 2 second ruko DEVA</div>

<script>
const PLAYLIST_ID = "PLYazKoZJJto_fOBHijYa1fWwZK7l0SVy5";
const grid = document.getElementById('grid');
const player = document.getElementById('mainPlayer');

// RSS wala method - ye GitHub par block nahi hota
fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?playlist_id=${PLAYLIST_ID}`)
.then(r=>r.json())
.then(data=>{
  grid.innerHTML = "";
  if(!data.items || data.items.length==0){
    grid.innerHTML = "YouTube ne playlist ka RSS band kar diya hai. Neeche wala Permanent wala code use karo.";
    return;
  }
  let seen = new Set();
  data.items.forEach((item, idx)=>{
    const link = item.link; // https://www.youtube.com/watch?v=XXXX
    const vid = link.split('v=')[1];
    if(seen.has(vid)) return;
    seen.add(vid);
    const title = item.title;
    const thumb = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;

    let div = document.createElement('div');
    div.className = 'card' + (idx==0?' active':'');
    div.innerHTML = `<img src="${thumb}"><p>${title}</p>`;
    div.onclick = ()=>{
      player.src = `https://www.youtube.com/embed/${vid}?list=${PLAYLIST_ID}&autoplay=1`;
      document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
      div.classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    };
    grid.appendChild(div);
  });
})
.catch(err=>{
  grid.innerHTML = "Internet slow hai, thumbnails load nahi hue. Upar wala player chal raha hai, right side ke 3 dot se aap 22 videos dekh sakte ho.";
});
</script>
</body>
</html>
