<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally Prime Course</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:sans-serif; user-select:none;}
.container{max-width:1200px;margin:auto;padding:10px;}
.player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;}
.player-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
#videoSelect{width:100%;padding:12px;margin:15px 0;border-radius:10px;background:#1f1f1f;color:#fff;border:1px solid #333;}
.radio-list{display:grid;gap:10px;}
.radio-item{display:flex;align-items:center;gap:10px;background:#1f1f1f;padding:8px;border-radius:10px;cursor:pointer;}
.radio-item img{width:100px;border-radius:6px;}
.radio-item.active{border:2px solid red;background:#2a2a2a;}
.radio-item input{display:none;}
@media (orientation: landscape) and (max-height:500px){
 .player-wrapper{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;border-radius:0;}
 #videoSelect,.radio-list,h2{display:none;}
}
</style>
</head>
<body>
<div class="container">
<h2 style="padding:10px 0">Tally Prime - 22 Videos</h2>
<div class="player-wrapper"><iframe id="player" src="" allowfullscreen allow="fullscreen; accelerometer; gyroscope"></iframe></div>
<select id="videoSelect"></select>
<div id="radioList" class="radio-list"></div>
</div>
<script>
const API_KEY = "AIzaSyCjWH-e5A0oOC0LMuSI4LK7m-gzudnvj9Y";
const PLAYLIST_ID = "PLYazKoZJJto_fOBHijYa1fWwZK7l0SVy5"; // <-- DEVA YAHAN APNI ORIGINAL PLAYLIST ID DAL DO JO JUNE WALE CODE ME THI
const MAX = 22;

async function loadVideos(){
 const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=${MAX}&playlistId=${PLAYLIST_ID}&key=${API_KEY}`;
 const res = await fetch(url);
 const data = await res.json();
 const select = document.getElementById('videoSelect');
 const radioList = document.getElementById('radioList');
 data.items.forEach((item,i)=>{
  const vid = item.snippet.resourceId.videoId;
  const title = item.snippet.title;
  const thumb = item.snippet.thumbnails.medium.url;
  const opt = document.createElement('option');
  opt.value = vid; opt.textContent = `${i+1}. ${title}`;
  select.appendChild(opt);
  const label = document.createElement('label');
  label.className = 'radio-item' + (i===0?' active':'');
  label.innerHTML = `<input type="radio" name="v" value="${vid}" ${i===0?'checked':''}><img src="${thumb}"><span>${title}</span>`;
  label.onclick = ()=> play(vid,label);
  radioList.appendChild(label);
  if(i===0) document.getElementById('player').src = `https://www.youtube.com/embed/${vid}?rel=0`;
 });
}
function play(id,el){
 document.getElementById('player').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
 document.querySelectorAll('.radio-item').forEach(e=>e.classList.remove('active'));
 if(el) el.classList.add('active');
 document.getElementById('videoSelect').value = id;
}
document.getElementById('videoSelect').addEventListener('change', e=>{ play(e.target.value); document.querySelector(`input[value="${e.target.value}"]`).checked=true; });
document.addEventListener('contextmenu', e=>e.preventDefault());
loadVideos();
</script>
</body>
</html>
