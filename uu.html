<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tally Prime - 22 Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Segoe UI,sans-serif; user-select:none; -webkit-user-select:none;}
.container{max-width:1100px;margin:0 auto;padding:0;}
.top-title{padding:15px; font-size:20px; font-weight:bold;}

/* PLAYER - NO GREY PATTI */
.player-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}
.player-wrapper iframe{
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  border:0;
}

/* CUSTOM COMBO BOX WITH RADIO + THUMBNAIL */
.custom-select{position:relative; width:95%; margin:15px auto;}
.select-btn{
  width:100%; padding:12px; background:#1f1f1f; border:1px solid #444; 
  border-radius:12px; color:#fff; display:flex; align-items:center; 
  gap:12px; cursor:pointer; text-align:left;
}
.select-btn img{width:70px; border-radius:6px;}
.select-dropdown{
  position:absolute; top:110%; left:0; width:100%; 
  background:#1e1e1e; border:1px solid #333; border-radius:12px;
  max-height:400px; overflow-y:auto; display:none; z-index:999;
}
.select-dropdown.show{display:block;}
.drop-item{
  display:flex; align-items:center; gap:10px; padding:10px;
  border-bottom:1px solid #2a2a2a; cursor:pointer;
}
.drop-item:hover, .drop-item.active{background:#2a2a2a;}
.drop-item img{width:110px; border-radius:6px; flex-shrink:0;}
.drop-item span{font-size:14px; line-height:1.3;}
.drop-item input{width:18px; height:18px; accent-color:red;}

/* RESPONSIVE */
@media(min-width:1024px){
  .player-wrapper{border-radius:12px;}
}
@media(max-width:767px){
  .top-title{font-size:16px;}
}

/* MOBILE LANDSCAPE - AUTO MOVE & FULL SCREEN */
@media (orientation: landscape) and (max-height: 500px){
  .player-wrapper{
    position:fixed !important;
    top:0; left:0;
    width:100vw !important; height:100vh !important;
    z-index:99999; border-radius:0;
  }
  .top-title, .custom-select{display:none !important;}
}
</style>
</head>
<body oncontextmenu="return false">
<div class="container">
  <div class="top-title">Tally Prime - 22 Videos</div>
  
  <div class="player-wrapper">
    <iframe id="player" src="" allowfullscreen allow="autoplay; fullscreen; accelerometer; gyroscope; picture-in-picture"></iframe>
  </div>

  <div class="custom-select" id="customSelect">
    <button class="select-btn" id="selectBtn">-- Video Select Karo --</button>
    <div class="select-dropdown" id="selectDrop"></div>
  </div>
</div>

<script>
const API_KEY = "AIzaSyCJWH-e5A0oOC0LMu5IALK7m-gzudnj9YY";
const PLAYLIST_ID = "PL8zT0y1z7e3u2x4x5y6z7a8b9c0d1e2f3"; // DEVA yahan apni original ID dalna, jo aapke purane code me thi

const btn = document.getElementById('selectBtn');
const drop = document.getElementById('selectDrop');
const player = document.getElementById('player');

btn.onclick = () => drop.classList.toggle('show');

async function load(){
  // Aapke photo me jo video chal raha hai usi playlist se load hoga
  const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=22&playlistId=${PLAYLIST_ID}&key=${API_KEY}`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){ btn.textContent = "Playlist ID galat hai - Check karo"; return; }

    data.items.forEach((it,i)=>{
      const vid = it.snippet.resourceId.videoId;
      const title = it.snippet.title;
      const thumb = it.snippet.thumbnails.medium.url;

      const div = document.createElement('div');
      div.className = 'drop-item' + (i===0?' active':'');
      div.innerHTML = `<input type="radio" name="v" ${i===0?'checked':''}> <img src="${thumb}"> <span>${title}</span>`;
      div.onclick = () => { play(vid,title,thumb,div); drop.classList.remove('show'); };
      drop.appendChild(div);

      if(i===0) play(vid,title,thumb,div);
    });
  }catch(e){ btn.textContent = "Load Failed"; }
}

function play(id,title,thumb,el){
  player.src = `https://www.youtube.com/embed/${id}?rel=0&autoplay=1&modestbranding=1`;
  btn.innerHTML = `<input type="radio" checked> <img src="${thumb}"> <span>${title}</span>`;
  document.querySelectorAll('.drop-item').forEach(d=>d.classList.remove('active'));
  if(el){ el.classList.add('active'); }
}

// SECURITY - VIEW SOURCE DISABLE
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('keydown', e=>{
  if(e.key==='F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && ['U','u','S','s'].includes(e.key))){
    e.preventDefault(); return false;
  }
});
document.addEventListener('selectstart', e=>e.preventDefault());

load();
</script>
</body>
</html>
