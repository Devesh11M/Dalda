	<script>
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        setInterval(() => {
            document.body.style.backgroundColor = getRandomColor();
        }, 3500);
    </script>

<!-- Login / Sign Up Modal Box -->
<div id="authModal" class="modal" style="display: flex;">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-bottom: 15px; color: #333; text-align: center;">साइन-इन (लॉगिन) करें</h2>
        <p style="text-align: center; font-size: 13px; color: #666; margin-bottom: 10px;">वेबसाइट देखने के लिए कृपया लॉगिन या साइन-अप करें।</p>
        
        <input type="text" id="username" placeholder="पूरा नाम (Username)" style="display: none;">
        <input type="email" id="email" placeholder="ईमेल आईडी">
        <input type="password" id="password" placeholder="पासवर्ड">
        
        <button class="submit-btn" onclick="handleSubmit()">सबमिट करें</button>
        <p class="msg" id="response-msg"></p>
        
        <div style="text-align: center; margin-top: 15px; font-size: 14px;">
            <a href="javascript:void(0);" id="switch-mode-link" onclick="toggleAuthMode()" style="color: #0066cc;">नया अकाउंट बनाएं (Sign Up)</a>
        </div>
    </div>
</div>

<main>

  <video id="videoPlayer" width="640" height="360" controls autoplay loop muted></video>
  
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4JzYjwnnK-3dtcNG7JAkLPDRRNy11fehe0nDX6kjXpMMNoVun3spDpcu58t5dvN2UPw/exec"; 

    let isLoginMode = true;

    // पेज लोड होते ही चेक करें
    window.onload = function() {
        const loggedUser = localStorage.getItem("loggedInUser");
        if (loggedUser) {
            // अगर पहले से लॉगिन है तो पॉप-अप हटा दें और लॉगआउट बटन दिखाएं
            document.getElementById('authModal').style.display = "none";
            document.getElementById('logout-btn').style.display = "inline-block";
            document.getElementById('nav-login-btn').style.display = "none";
            document.getElementById('nav-signup-btn').style.display = "none";
        } else {
            // अगर लॉगिन नहीं है तो हर हाल में पॉप-अप खुला रहेगा
            document.getElementById('authModal').style.display = "flex";
        }
    }

    function openModal(mode) {
        isLoginMode = (mode === 'login');
        updateModalUI();
        document.getElementById('authModal').style.display = "flex";
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        updateModalUI();
    }

    function updateModalUI() {
        document.getElementById('modal-title').innerText = isLoginMode ? "साइन-इन (लॉगिन) करें" : "नया अकाउंट साइन-अप करें";
        document.getElementById('username').style.display = isLoginMode ? "none" : "block";
        document.getElementById('switch-mode-link').innerText = isLoginMode ? "नया अकाउंट बनाएं (Sign Up)" : "पहले से अकाउंट है? Login करें";
        document.getElementById('response-msg').innerText = "";
    }

    async function handleSubmit() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgElem = document.getElementById('response-msg');

        if (!email || !password || (!isLoginMode && !username)) {
            msgElem.style.color = "red";
            msgElem.innerText = "कृपया सभी आवश्यक फील्ड्स भरें!";
            return;
        }

        const payload = {
            action: isLoginMode ? 'signin' : 'signup',
            username: username,
            email: email,
            password: password
        };

        msgElem.style.color = "#333";
        msgElem.innerText = "प्रक्रिया जारी है, कृपया प्रतीक्षा करें...";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            msgElem.style.color = result.success ? "green" : "red";
            msgElem.innerText = result.message;

            if (result.success) {
                localStorage.setItem("loggedInUser", result.username || email);
                
                setTimeout(() => {
                    document.getElementById('authModal').style.display = "none";
                    document.getElementById('logout-btn').style.display = "inline-block";
                    document.getElementById('nav-login-btn').style.display = "none";
                    document.getElementById('nav-signup-btn').style.display = "none";
                    window.location.reload();
                }, 600);
            }
        } catch (error) {
            msgElem.style.color = "red";
            msgElem.innerText = "सर्वर से कनेक्ट करने में त्रुटि हुई!";
        }
    }

    function handleLogout() {
        localStorage.removeItem("loggedInUser");
        alert("आप सफलतापूर्वक लॉग आउट हो गए हैं।");
        window.location.reload();
    }
  </script>

  <script>
    const videoSources = ["video1.mp4", "video2.mp4", "video3.mp4"];
    const videoPlayer = document.getElementById("videoPlayer");
    let currentVideoIndex = 0;

    function playNextVideo() {
      if (currentVideoIndex < videoSources.length) {
        videoPlayer.src = videoSources[currentVideoIndex];
        videoPlayer.play();
        currentVideoIndex++;
      } else {
        currentVideoIndex = 0;
        playNextVideo();
      }
    }

    videoPlayer.addEventListener("ended", playNextVideo);
    playNextVideo();
  </script>
